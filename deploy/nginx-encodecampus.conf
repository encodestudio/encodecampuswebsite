# /etc/nginx/sites-available/encodecampus.encodestudio.in
#
# Serves the built React SPA and reverse-proxies the Django API/admin.
# certbot --nginx will add the matching TLS (443) server block and the
# HTTP->HTTPS redirect automatically.

upstream encodecampus_app {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name encodecampus.encodestudio.in;

    root /srv/encodecampus/frontend/dist;
    index index.html;

    client_max_body_size 5m;

    # ---- gzip ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # ---- Django: API + admin ----
    location ~ ^/(api|admin)/ {
        proxy_pass http://encodecampus_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ---- Django collected static (admin, DRF browsable API) ----
    location /static/ {
        alias /srv/encodecampus/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---- Hashed SPA build assets ----
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA: every other path falls back to index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # basic security headers (HSTS is added by Django once TLS is on)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
